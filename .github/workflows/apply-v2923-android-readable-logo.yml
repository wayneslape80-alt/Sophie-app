name: Apply v2.9.2.3 Android readability and logo fix

on:
  push:
    branches:
      - hotfix-v2.9.2.3-android-readable-logo

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-v2.9.2.3-android-readable-logo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded product patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = '2.9.2.3'

          index = Path('index.html')
          text = index.read_text()
          old = '''        const shortScreenSide = Math.min(screenWidth, screenHeight);\n        const isTouchDevice = coarsePointer.matches || navigator.maxTouchPoints > 0;\n        // Android devices can report their physical/CSS short side well above\n        // 600px. A coarse pointer plus a sub-900px short side is still a phone\n        // class experience and must receive the readable compact layout.\n        const isPhoneScreen = isTouchDevice && shortScreenSide < 900;'''
          new = '''        const shortScreenSide = Math.min(screenWidth, screenHeight);\n        const longScreenSide = Math.max(screenWidth, screenHeight);\n        const screenAspect = longScreenSide / Math.max(1, shortScreenSide);\n        const isTouchDevice = coarsePointer.matches || navigator.maxTouchPoints > 0;\n        // Some Android PWAs report a 1080-ish short side even though they are\n        // physically phone-shaped. Treat tall touch displays as phone-class too.\n        const isPhoneScreen = isTouchDevice && (\n          shortScreenSide < 900 ||\n          (shortScreenSide <= 1200 && screenAspect >= 1.75)\n        );'''
          if old not in text:
              raise SystemExit('expected phone classification block not found')
          text = text.replace(old, new, 1)
          text = text.replace('android-first.css?v=2.9.2.2', f'android-first.css?v={version}')
          text = text.replace('style-lab.js?v=2.9.2.2', f'style-lab.js?v={version}')
          text = text.replace('sw.js?v=2.9.2.2', f'sw.js?v={version}')
          index.write_text(text)

          css = Path('assets/android-first.css')
          text = css.read_text()
          old = '''html.compact-device {\n  --nav-height: 6rem;\n  font-size: 125% !important;\n}'''
          new = '''html.compact-device {\n  --nav-height: 6rem;\n  /* Physical Android feedback: 125% was still too small. */\n  font-size: 137.5% !important;\n}'''
          if old not in text:
              raise SystemExit('expected compact scale block not found')
          text = text.replace(old, new, 1)
          old = '''html.compact-device .topbar {\n  gap: 0.625rem;\n  padding-right: max(1rem, env(safe-area-inset-right));\n}\n\nhtml.compact-device .top-actions {\n  flex: 0 0 auto;\n  margin-right: 0.5rem;\n}'''
          new = '''html.compact-device .topbar {\n  gap: 0.625rem;\n  padding-left: max(1rem, env(safe-area-inset-left));\n  padding-right: max(1.25rem, calc(env(safe-area-inset-right) + 0.75rem));\n}\n\nhtml.compact-device .topbar > :first-child {\n  min-width: 0;\n}\n\nhtml.compact-device .top-actions {\n  flex: 0 0 auto;\n  margin-right: 0.75rem;\n}\n\nhtml.compact-device #topbar-title {\n  overflow-wrap: anywhere;\n}\n\nhtml.compact-device .avatar-button {\n  position: relative;\n  z-index: 2;\n}'''
          if old not in text:
              raise SystemExit('expected compact topbar block not found')
          text = text.replace(old, new, 1)

          # CSS-only fallback for wide-reporting touch phones if JS classification is late.
          fallback = '''\n\n/* v2.9.2.3: wide-reporting phone fallback. Keeps readable sizing and edge clearance\n * even during the brief period before JS classifies the device. */\n@media (pointer: coarse) and (max-width: 1200px), (hover: none) and (max-width: 1200px) {\n  html {\n    font-size: 137.5%;\n  }\n\n  .topbar {\n    padding-left: max(1rem, env(safe-area-inset-left));\n    padding-right: max(1.25rem, calc(env(safe-area-inset-right) + 0.75rem));\n  }\n\n  .top-actions {\n    flex: 0 0 auto;\n    margin-right: 0.75rem;\n  }\n}\n'''
          text += fallback
          css.write_text(text)

          style = Path('assets/style-lab.js')
          text = style.read_text()
          text = text.replace('Sophie App v2.9.2.2', f'Sophie App v{version}', 1)
          text = text.replace('const CANDIDATE_VERSION = "v2.9.2.2";', f'const CANDIDATE_VERSION = "v{version}";', 1)
          style.write_text(text)

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace('sophie-app-v2-9-2-2-android-large-ui-hotfix', 'sophie-app-v2-9-2-3-android-readable-logo')
          text = text.replace('android-first.css?v=2.9.2.2', f'android-first.css?v={version}')
          text = text.replace('style-lab.js?v=2.9.2.2', f'style-lab.js?v={version}')
          sw.write_text(text)
          PY

      - name: Verify bounded fix
        run: |
          node --check assets/style-lab.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          css = Path('assets/android-first.css').read_text()
          js = Path('assets/style-lab.js').read_text()
          sw = Path('sw.js').read_text()
          checks = {
            'tall-phone classification': 'shortScreenSide <= 1200 && screenAspect >= 1.75' in html,
            'larger compact root': 'font-size: 137.5% !important' in css,
            'wide touch fallback': '@media (pointer: coarse) and (max-width: 1200px)' in css,
            'right edge clearance': 'env(safe-area-inset-right) + 0.75rem' in css,
            'v2.9.2.3 css url': 'android-first.css?v=2.9.2.3' in html,
            'v2.9.2.3 js url': 'style-lab.js?v=2.9.2.3' in html,
            'v2.9.2.3 sw url': 'sw.js?v=2.9.2.3' in html,
            'style marker': 'const CANDIDATE_VERSION = "v2.9.2.3";' in js,
            'cache marker': 'sophie-app-v2-9-2-3-android-readable-logo' in sw,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(('PASS' if ok else 'FAIL'), name)
          if failed: raise SystemExit('failed: ' + ', '.join(failed))
          PY

      - name: Remove temporary workflow and commit product patch
        run: |
          rm -f .github/workflows/apply-v2923-android-readable-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/android-first.css assets/style-lab.js sw.js .github/workflows/apply-v2923-android-readable-logo.yml
          git commit -m 'Stage v2.9.2.3 Android readability and logo clearance'
          git push origin HEAD:hotfix-v2.9.2.3-android-readable-logo
