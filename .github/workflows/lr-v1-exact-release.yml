name: Install exact tested lr-v1 frontend

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  install-exact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-lr-v1-learning-resources
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild exact locally tested candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > index.html
          cat _lr_release/index.diff.gz.b64 | base64 -d | gzip -d > /tmp/lr-index.diff
          patch index.html < /tmp/lr-index.diff
          echo '9c559718ff02e54178b394aee4d4511d87be8b7bdbd025732f94d46e9c1603cd  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = "a1432a22da6becc8bf0c995b5a14069cf9efe386"
          echo '742142eea15a2a494acb2a32047174a208a888d89fcfc986c69addecfa681e8b  sw.js' | sha256sum -c -
          test "$(git hash-object sw.js)" = "508bef836483a51bd807b3b93160c95cd157c514"
          grep -q 'learningResourceContractVersion' index.html
          grep -q 'suggestLearningResource' index.html
          grep -q 'www.youtube-nocookie.com' index.html
          grep -q 'sophie-app-v2-9-learning-resources' sw.js
          ! grep -q 'action: "claimJob"' index.html
          ! grep -q 'action: "approveJob"' index.html
          ! grep -q 'action: "rejectJob"' index.html
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/sophie-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sophie-inline.js
          node --check sw.js

      - name: Commit only exact production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/lr-v1-exact-release.yml _lr_release/index.diff.gz.b64
          git add -- index.html sw.js
          git commit -m "Release exact tested lr-v1 Learning Resources frontend"
          git push origin HEAD:release-lr-v1-learning-resources
