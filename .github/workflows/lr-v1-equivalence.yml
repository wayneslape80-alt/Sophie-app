name: Verify lr-v1 canonical equivalence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-lr-v1-learning-resources
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tested-candidate equivalence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          canonical = re.sub(r'/\*.*?\*/', '', html, flags=re.S)
          canonical = re.sub(r'\s+', ' ', canonical).strip()
          digest = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          expected = '3331cf5d415fd3227febdbde75570c3003a7a1a7a16030ea9402114b2edd5974'
          print('canonical_length=', len(canonical))
          print('canonical_sha256=', digest)
          if digest != expected:
              raise SystemExit(f'canonical index mismatch: {digest} != {expected}')
          PY
          test "$(git hash-object sw.js)" = "508bef836483a51bd807b3b93160c95cd157c514"
          grep -q 'learningResourceContractVersion' index.html
          grep -q 'suggestLearningResource' index.html
          grep -q 'www.youtube-nocookie.com' index.html
          grep -q 'sophie-app-v2-9-learning-resources' sw.js
          ! grep -q 'action: "claimJob"' index.html
          ! grep -q 'action: "approveJob"' index.html
          ! grep -q 'action: "rejectJob"' index.html

      - name: Remove one-shot equivalence workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/lr-v1-equivalence.yml
          git commit -m "Remove lr-v1 equivalence release gate"
          git push origin HEAD:release-lr-v1-learning-resources
