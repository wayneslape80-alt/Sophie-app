name: v2.7 Skill Pathways staging

on:
  push:
    branches:
      - stage-v2.7-interactive-skill-pathways

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-v2.7-interactive-skill-pathways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic pathway staging patch
        run: python3 scripts/apply_v27_skill_pathways_stage.py
      - name: Enable existing-route technique learning choice
        run: python3 scripts/enable_v27_learning_choice_stage.py
      - name: Validate staged JavaScript
        run: node --check assets/skill-pathways-v27.js
      - name: Validate integration contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text()
          sw = Path('sw.js').read_text()
          js = Path('assets/skill-pathways-v27.js').read_text()
          assert index.count('<script src="./assets/skill-pathways-v27.js"></script>') == 1
          assert './assets/skill-pathways-v27.js' in sw
          assert 'sophie-app-v2-16-skill-pathways-stage' in sw
          for number in range(1, 23):
              technique = f'COOK-T{number:03d}'
              assert technique in js, technique
          assert 'action: "chooseRecommendedLearn"' not in js, 'must reuse the existing chooseRecommendation path rather than duplicate the mutation action'
          assert 'action: "createOpportunity"' not in js, 'technique choice must not bypass rec-v1'
          assert 'action: "getLearningCandidateCatalogue"' in js
          assert 'chooseRecommendation' in js
          assert 'data-v27-technique' in js
          assert 'data-v27-technique-back' in js
          assert 'data-v27-learn-technique' in js
          assert 'data-v27-technique-safety' in js
          assert 'data-v27-technique-candidate' in js
          assert 'skillsTechniqueId' in js
          assert '<details class="technique-group"' in js
          assert 'Safety-gated next step' in js
          assert 'Adding it creates a Learn activity in Available' in js
          PY
      - name: Commit generated staging files
        run: |
          if git diff --quiet -- index.html sw.js assets/skill-pathways-v27.js; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "wayneslape80-alt"
          git config user.email "wayneslape80@gmail.com"
          git add index.html sw.js assets/skill-pathways-v27.js
          git commit -m "Connect v2.7 techniques to existing rec-v1 choice path"
          git push origin HEAD:stage-v2.7-interactive-skill-pathways
