name: v2.7 Skill Pathways staging

on:
  push:
    branches:
      - stage-v2.7-interactive-skill-pathways

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-v2.7-interactive-skill-pathways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic pathway staging patch
        run: python3 scripts/apply_v27_skill_pathways_stage.py
      - name: Verify generated product files are committed
        run: |
          git diff --exit-code -- index.html sw.js assets/skill-pathways-v27.js assets/skill-pathways-v27-choice.js
      - name: Validate staged JavaScript and static contracts
        run: |
          node --check --input-type=commonjs < Code.gs
          node --check assets/skill-pathways-v27.js
          node --check assets/skill-pathways-v27-choice.js
          node --check tests/v27-pathway-fixture.cjs
          node --check tests/v27-backend-pathway-contract.cjs
          node --check tests/v27-pathways-runtime.cjs
          node --check tests/v27-static-contracts.cjs
          node tests/v27-static-contracts.cjs
          node tests/v27-backend-pathway-contract.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run Android-first and desktop pathway matrix
        run: node tests/v27-browser-regression.cjs
      - name: Run focused v2.7 runtime regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v27-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/v27-pathways-runtime.cjs
      - name: Run full product, accessibility and PWA regression
        run: node tests/v27-full-regression.cjs
