name: v2.9.2 Saved Looks diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static parsing
        run: |
          node --check assets/style-lab.js
          node --check sw.js
          node --check tests/v292-saved-looks-review.cjs
      - name: Prepare production base snapshot
        run: |
          mkdir -p /tmp/v292-base
          git archive 1404bf6d95b720c1ea5a9c1fc2729ee09d020b63 | tar -x -C /tmp/v292-base
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run bounded browser gates
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v292-head-http.log 2>&1 &
          HEAD_PID=$!
          (cd /tmp/v292-base && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/v292-base-http.log 2>&1) &
          BASE_PID=$!
          trap 'kill $HEAD_PID $BASE_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null && curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/v292-saved-looks-review.cjs
