name: D006 release trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.issue.title == 'D006 release assembler trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-d006-opportunity-board-v2.4
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and verify release files
        shell: bash
        run: |
          set -euo pipefail
          cat _release_chunks/index.*.b64part | base64 -d | gunzip > index.html
          cat _release_chunks/sw.*.b64part | base64 -d | gunzip > sw.js

          echo "bf0db9019d1afef2004c1b35e6f18d06d2f20339ab74d2332edcbf0c1a9cc690  index.html" | sha256sum -c -
          echo "e0c1a1102f9335dc6b807ef1bd9601325e6e054c8606040cb20b63d237c30cf4  sw.js" | sha256sum -c -

          ! grep -q 'action: "claimJob"' index.html
          ! grep -q 'action: "approveJob"' index.html
          ! grep -q 'action: "rejectJob"' index.html
          grep -q 'action: "startOpportunity"' index.html
          grep -q 'action: "finishOpportunity"' index.html
          grep -q 'action: "withdrawEarn"' index.html
          grep -q 'action: "stopLearn"' index.html
          grep -q 'action: "reviewEarn"' index.html
          grep -q 'action: "completeContributionReview"' index.html
          grep -q 'action: "createOpportunity"' index.html
          grep -q 'sophie-app-v2-8-d006-opportunities' sw.js

          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/sophie-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sophie-inline.js
          node --check sw.js

      - name: Commit clean release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _release_chunks
          rm -f .github/workflows/build-d006-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js
          git add -A -- _release_chunks .github/workflows/build-d006-release.yml
          git commit -m "Release D-006 Opportunity Board frontend"
          git push origin HEAD:release-d006-opportunity-board-v2.4
