name: D006 release trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.issue.title == 'D006 release assembler trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-d006-opportunity-board-v2.4
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and verify release files
        shell: bash
        run: |
          set -euo pipefail
          cat .d006/index.*.b64 | base64 -d | gunzip > index.html
          cat .d006/sw.b64 | base64 -d | gunzip > sw.js

          echo "b18d4225dcb123cb298d955d92e947cda3613d99c7bb22a0ced4b29e760f4d65  index.html" | sha256sum -c -
          echo "e0c1a1102f9335dc6b807ef1bd9601325e6e054c8606040cb20b63d237c30cf4  sw.js" | sha256sum -c -

          ! grep -q 'action: "claimJob"' index.html
          ! grep -q 'action: "approveJob"' index.html
          ! grep -q 'action: "rejectJob"' index.html
          grep -q 'startOpportunity' index.html
          grep -q 'finishOpportunity' index.html
          grep -q 'withdrawEarn' index.html
          grep -q 'stopLearn' index.html
          grep -q 'reviewEarn' index.html
          grep -q 'completeContributionReview' index.html
          grep -q 'createOpportunity' index.html
          grep -q 'sophie-app-v2-8-d006-opportunities' sw.js

      - name: Commit clean release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .d006
          rm -f .github/workflows/d006-reconstruct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js .d006 .github/workflows/d006-reconstruct.yml
          git commit -m "Release D-006 Opportunity Board"
          git push origin HEAD:release-d006-opportunity-board-v2.4
