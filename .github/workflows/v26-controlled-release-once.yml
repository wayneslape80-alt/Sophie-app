name: v2.6 controlled release once

on:
  push:
    branches:
      - stage-skills-android-first-v2.6.0
    paths:
      - '.github/workflows/v26-controlled-release-once.yml'

permissions:
  contents: write

jobs:
  promote-approved-product-files:
    if: github.event.head_commit.message == 'Execute controlled v2.6 production release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch accepted staging commit
        run: git fetch origin a98e53d7131cc87541dbf88a352fa745c0c11008

      - name: Verify production base has not drifted
        run: |
          test "$(git rev-parse HEAD)" = "880f9bdd5eadeaff518fc19b87f23d158a7a9ca0"

      - name: Promote exact approved product files
        run: |
          git checkout a98e53d7131cc87541dbf88a352fa745c0c11008 -- index.html manifest.webmanifest sw.js
          mkdir -p assets
          git show a98e53d7131cc87541dbf88a352fa745c0c11008:assets/android-first.css > assets/android-first.css

      - name: Enforce four-file release scope
        run: |
          expected=$(printf '%s\n' assets/android-first.css index.html manifest.webmanifest sw.js)
          actual=$(git status --short | sed -E 's/^.. //' | sort)
          test "$actual" = "$expected"

      - name: Verify exact accepted blobs
        run: |
          test "$(git hash-object index.html)" = "7f3079f23abf4576e734911b48b75c21d4bf7b63"
          test "$(git hash-object assets/android-first.css)" = "1e4d8d922d167bf15d3baab362624f3f5760e26b"
          test "$(git hash-object manifest.webmanifest)" = "58b3f2acfc72e9aac729e22d65b865bbaf2479ad"
          test "$(git hash-object sw.js)" = "3bd39bce5af3258d69119655c229260d0e76f8da"

      - name: Commit and push production release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/android-first.css manifest.webmanifest sw.js
          git commit -m 'Release v2.6 Skills and Android-first frontend'
          git push origin HEAD:main
