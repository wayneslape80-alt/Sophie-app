name: Assemble D-006 release branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/assemble-d006-release.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-d006-opportunity-board-v2.4
          fetch-depth: 0
      - name: Reassemble and verify exact reviewed files
        shell: bash
        run: |
          cat _release_chunks/index.*.b64part | base64 -d | gzip -d > index.html
          cat _release_chunks/sw.*.b64part | base64 -d | gzip -d > sw.js
          echo 'bf0db9019d1afef2004c1b35e6f18d06d2f20339ab74d2332edcbf0c1a9cc690  index.html' | sha256sum -c -
          echo 'e0c1a1102f9335dc6b807ef1bd9601325e6e054c8606040cb20b63d237c30cf4  sw.js' | sha256sum -c -
          ! grep -q 'action: "claimJob"' index.html
          ! grep -q 'action: "approveJob"' index.html
          ! grep -q 'action: "rejectJob"' index.html
          grep -q 'action: "startOpportunity"' index.html
          grep -q 'action: "finishOpportunity"' index.html
          grep -q 'action: "withdrawEarn"' index.html
          grep -q 'action: "stopLearn"' index.html
          grep -q 'action: "reviewEarn"' index.html
          grep -q 'action: "completeContributionReview"' index.html
          grep -q 'sophie-app-v2-8-d006-opportunities' sw.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/sophie-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sophie-inline.js
          node --check sw.js
      - name: Commit verified files to release branch
        shell: bash
        run: |
          git config user.name 'Sophie App Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- index.html sw.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Release D-006 Opportunity Board frontend'
          git push origin HEAD:release-d006-opportunity-board-v2.4
